baseURL = 'https://macworks.dev/'
title = 'MacWorks'
defaultContentLanguage = 'en'
disablePathToLower = true
enableGitInfo = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[pagination]
pagerSize = 30

[permalinks]
  [permalinks.page]
  docs = '/articles/:contentbasename/'

  [permalinks.section]
  docs = '/editions/:sections[1:]/'

[outputs]
home = ['HTML', 'RSS', 'SearchIndex']

[outputFormats.SearchIndex]
mediaType = 'application/json'
baseName = 'search-index'
isPlainText = true
notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
    unsafe = true

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
      block = true

  [markup.highlight]
  style = 'github'
  noClasses = false

[params]
description = 'A daily digest of technology, AI, business, sports, video, and local news.'

[params.cloudflareWebAnalytics]
# Public site token, not a Cloudflare API credential.
token = 'f34a1580a722468488dbf3955c9f9c2c'
