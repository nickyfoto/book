{{ define "main" }}
<div class="empty-state shell" data-not-found>
  <p class="section-label">404</p>
  <h1>That page has moved.</h1>
  <p>Older edition links are redirected to their permanent article address when possible.</p>
  <p><a class="back-link" href="/">Back to the latest edition</a></p>
</div>
<script>
  (() => {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts[0] === 'docs' && parts.length > 1) {
      const isCollection = parts.length <= 3 && !/^.+-[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(parts.at(-1));
      if (isCollection) {
        const collection = parts.slice(1).map(encodeURIComponent).join('/');
        location.replace(`/editions/${collection}/${location.search}${location.hash}`);
        return;
      }
      const filename = encodeURIComponent(parts.at(-1));
      const isWeeklyArchive = parts[1] === 'month' && parts.length >= 4;
      const category = isWeeklyArchive ? `${encodeURIComponent(parts.at(-2))}/` : '';
      location.replace(`/articles/${category}${filename}/${location.search}${location.hash}`);
    }
  })();
</script>
{{ end }}
