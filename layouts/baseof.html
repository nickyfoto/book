<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>{{ if .IsHome }}{{ site.Title }} — Daily Edition{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ $styles := resources.Get "site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
</head>
<body class="page-kind-{{ .Kind }}{{ if .IsHome }} is-home{{ end }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "site/header.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "site/footer.html" . }}
  {{ partial "site/search.html" . }}
  {{ $scripts := resources.Get "site.js" | minify | fingerprint }}
  <script src="{{ $scripts.RelPermalink }}" integrity="{{ $scripts.Data.Integrity }}" defer></script>
</body>
</html>
