{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ with .Prev }}<a href="{{ .URL }}">Previous</a>{{ else }}<span></span>{{ end }}
  <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ with .Next }}<a href="{{ .URL }}">Next</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
